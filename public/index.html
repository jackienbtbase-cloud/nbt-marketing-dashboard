<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBT Marketing Pipeline Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>NBT Marketing Prospects Movement</h1>
            <div class="controls">
                <label for="periodSelect">Period:</label>
                <select id="periodSelect">
                    <option value="30">Last 30 Days</option>
                    <option value="90">Last 90 Days</option>
                    <option value="365">This Year</option>
                </select>
            </div>
        </header>
		
		<section class="interactive-pipeline">
            <div id="pipelineBlocks" class="pipeline-blocks">
                <!-- Blocks generated by JS -->
            </div>
            
            <!-- Hidden container that appears when a block is clicked -->
            <div id="ticketDetailsContainer" class="ticket-details-container" style="display: none;">
                <div class="details-header">
                    <h3 id="selectedStatusTitle">Select a status</h3>
                    <button id="closeDetailsBtn" class="close-btn">&times;</button>
                </div>
                <div id="ticketList" class="ticket-list">
                    <!-- Ticket cards generated by JS -->
                </div>
            </div>
        </section>
		
        <section class="metrics-grid">
            <div class="card">
                <h3>New Created</h3>
                <p id="createdCount">0</p>
            </div>
            <div class="card">
                <h3>Closed Won</h3>
                <p id="wonCount">0</p>
            </div>
            <div class="card">
                <h3>Closed Lost</h3>
                <p id="lostCount">0</p>
            </div>
        </section>

        <section class="chart-container">
            <canvas id="movementChart"></canvas>
        </section>
		<section class="table-container">
            <h2>Stagnant Prospects</h2>
            <div class="table-responsive">
                <table id="stagnantTable">
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Prospect Summary</th>
                            <th>Assignee</th>
                            <th>Current Phase</th>
                            <th>Days Stagnant</th>
                        </tr>
                    </thead>
                    <tbody id="stagnantBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
